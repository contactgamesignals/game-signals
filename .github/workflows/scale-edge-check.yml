name: Scale Edge Checks

on:
  pull_request:
  workflow_dispatch:

jobs:
  edge-scale:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Typecheck scaled Edge Functions
        run: |
          deno check --node-modules-dir=auto supabase/functions/scan-youtube/index.ts
          deno check --node-modules-dir=auto supabase/functions/scan-twitch/index.ts
          deno check --node-modules-dir=auto supabase/functions/notify-discord/index.ts
          deno check --node-modules-dir=auto supabase/functions/notify-email/index.ts
          deno check --node-modules-dir=auto supabase/functions/send-account-agreement-confirmation/index.ts

      - name: Test YouTube detail queue in isolated PostgreSQL 17
        shell: bash
        run: |
          docker pull postgres:17-alpine
          for attempt in 1 2 3 4; do
            if bash scripts/test-youtube-detail-queue-postgres.sh; then
              exit 0
            fi
            if [ "$attempt" -eq 4 ]; then
              echo "Isolated PostgreSQL regression failed after 4 clean-container attempts."
              exit 1
            fi
            echo "PostgreSQL container initialization raced with the test; retrying clean-container attempt $((attempt + 1))/4."
            sleep $((attempt * 2))
          done

name: One-time dashboard UX patch

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/one-time-dashboard-ux.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Patch dashboard UX
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('components/DashboardClient.tsx')
          text = path.read_text()

          anchor = '''  }, [games, workspaceId]);

  useEffect(() => {
    const pendingRaw = localStorage.getItem(PENDING_GAME_STORAGE_KEY) ?? localStorage.getItem(LEGACY_PENDING_GAME_STORAGE_KEY);'''
          replacement = '''  }, [games, workspaceId]);

  useEffect(() => {
    setGames(initialGames);
  }, [initialGames]);

  useEffect(() => {
    setMentions(initialMentions);
  }, [initialMentions]);

  useEffect(() => {
    if (plan === "free" || !games.some((game) => game.enabled)) return;

    const refresh = () => {
      if (!document.hidden) router.refresh();
    };
    const onVisibilityChange = () => {
      if (!document.hidden) refresh();
    };
    const timer = window.setInterval(refresh, 60_000);
    window.addEventListener("focus", refresh);
    document.addEventListener("visibilitychange", onVisibilityChange);

    return () => {
      window.clearInterval(timer);
      window.removeEventListener("focus", refresh);
      document.removeEventListener("visibilitychange", onVisibilityChange);
    };
  }, [games, plan, router]);

  useEffect(() => {
    const pendingRaw = localStorage.getItem(PENDING_GAME_STORAGE_KEY) ?? localStorage.getItem(LEGACY_PENDING_GAME_STORAGE_KEY);'''
          if anchor not in text:
              raise SystemExit('auto-refresh anchor not found')
          text = text.replace(anchor, replacement, 1)

          old_actions = '''              <span className="plan-pill">{planLabel} · {activeGames}/{gameLimit} active games</span>
              {plan !== "free" ? <a className="btn btn-ghost" href="/api/export">Export CSV</a> : null}
              <button className="btn btn-primary" disabled={atGameLimit || busy} onClick={openNewMonitor}>
                {atGameLimit ? "Active game limit reached" : "Add game"}
              </button>'''
          new_actions = '''              <span className="plan-pill">
                {plan === "free" ? `${activeGames}/${gameLimit} active games` : `${planLabel} · ${activeGames}/${gameLimit} active games`}
              </span>
              {plan !== "free" ? <a className="btn btn-ghost" href="/api/export">Export CSV</a> : null}
              {atGameLimit ? (
                <Link className="btn btn-primary" href="/dashboard/settings">
                  {plan === "free" ? "Choose a plan" : "Change plan"}
                </Link>
              ) : (
                <button className="btn btn-primary" disabled={busy} onClick={openNewMonitor}>Add game</button>
              )}'''
          if old_actions not in text:
              raise SystemExit('dashboard actions anchor not found')
          text = text.replace(old_actions, new_actions, 1)

          old_limit = '''          {atGameLimit ? (
            <div className="status-message">
              You are using all {gameLimit} active monitoring slot{gameLimit === 1 ? "" : "s"} on {planLabel}. Pause a game or manage your plan in Settings to monitor another title.
            </div>
          ) : null}'''
          new_limit = '''          {atGameLimit ? (
            <div className="status-message">
              {plan === "free"
                ? "You are using the available active monitoring slot. Choose a plan in Settings to monitor more games."
                : <>You are using all {gameLimit} active monitoring slot{gameLimit === 1 ? "" : "s"} on {planLabel}. Pause a game or change your plan in Settings to monitor another title.</>}
            </div>
          ) : null}'''
          if old_limit not in text:
              raise SystemExit('limit message anchor not found')
          text = text.replace(old_limit, new_limit, 1)

          text = text.replace('atGameLimit ? "No free slot" : "Resume"', 'atGameLimit ? "No available slot" : "Resume"')

          path.write_text(text)
          PY
      - name: Verify
        run: npm ci && npm run lint && npm run typecheck
      - name: Commit patch
        run: |
          git config user.name "contactgamesignals"
          git config user.email "contact.gamesignals@gmail.com"
          git add components/DashboardClient.tsx
          git diff --cached --quiet && exit 0
          git commit -m "Improve dashboard plan flow and automatic refresh"
          git push

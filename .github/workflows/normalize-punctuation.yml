name: Normalize punctuation

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/normalize-punctuation.yml

permissions:
  contents: write

jobs:
  normalize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: main

      - name: Replace forbidden punctuation
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');
          const forbidden = String.fromCodePoint(0x2014);
          const ignored = new Set(['.git', '.next', 'node_modules', '.vercel', 'coverage', 'dist']);
          const extensions = new Set(['.cjs','.css','.csv','.html','.js','.json','.jsx','.md','.mjs','.sql','.svg','.ts','.tsx','.txt','.yml','.yaml']);

          function walk(dir) {
            for (const entry of fs.readdirSync(dir, { withFileTypes: true })) {
              if (entry.isDirectory() && ignored.has(entry.name)) continue;
              const absolute = path.join(dir, entry.name);
              if (entry.isDirectory()) {
                walk(absolute);
                continue;
              }
              if (!entry.isFile() || !extensions.has(path.extname(entry.name).toLowerCase())) continue;
              let content;
              try {
                content = fs.readFileSync(absolute, 'utf8');
              } catch {
                continue;
              }
              if (!content.includes(forbidden)) continue;
              fs.writeFileSync(absolute, content.split(forbidden).join('-'), 'utf8');
              console.log(`Updated ${path.relative(process.cwd(), absolute)}`);
            }
          }

          walk(process.cwd());
          NODE

      - name: Verify punctuation
        run: node scripts/check-no-long-dash.mjs

      - name: Commit normalized punctuation
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No changes needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Remove long dash characters across repository"
          git push origin main

name: Scan Twitch

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/scan-twitch.yml
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Request GitHub OIDC token
        id: oidc
        shell: bash
        run: |
          set -euo pipefail
          RESPONSE="$(curl -fsSL \
            -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=gamesignal-scheduler")"
          TOKEN="$(printf '%s' "$RESPONSE" | python3 -c 'import json,sys; print(json.load(sys.stdin)["value"])')"
          test -n "$TOKEN"
          echo "::add-mask::$TOKEN"
          echo "token=$TOKEN" >> "$GITHUB_OUTPUT"

      - name: Invoke Twitch scanner
        shell: bash
        env:
          OIDC_TOKEN: ${{ steps.oidc.outputs.token }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          BODY='{}'
          if [ "$EVENT_NAME" = "push" ] || [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            BODY='{"healthcheck":true}'
          fi

          curl --fail-with-body --silent --show-error \
            --request POST \
            --header "Authorization: Bearer ${OIDC_TOKEN}" \
            --header "x-gamesignal-scheduler: github-actions" \
            --header "Content-Type: application/json" \
            --data "$BODY" \
            "https://mgaufxduaaobrlyzdrdo.supabase.co/functions/v1/scan-twitch"

name: CI

on:
  push:
    branches:
      - production-app
      - main
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          package-manager-cache: false

      - name: Install dependencies
        run: npm install

      - name: Typecheck
        run: npm run typecheck

      - name: Validate FA(3) against official MF XSD
        run: |
          chmod +x scripts/validate-fa3-xsd.sh
          bash scripts/run-fa3-validation.sh
          bash scripts/run-fa3-active-vat-validation.sh

      - name: Setup .NET 10 for one-time KSeF TEST probe
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: One-time active VAT FA(3) KSeF TEST OnlineSession + UPO
        run: |
          chmod +x scripts/probe-ksef-test-gamesignal-fa3-active-vat-e2e.sh
          bash scripts/probe-ksef-test-gamesignal-fa3-active-vat-e2e.sh

      - name: Test financial retention cascade in isolated PostgreSQL 17
        shell: bash
        run: |
          set -o pipefail
          docker pull postgres:17-alpine
          LOG_FILE="$(mktemp)"

          run_retention_test() {
            : > "$LOG_FILE"
            set +e
            bash scripts/test-financial-retention-postgres.sh 2>&1 | tee "$LOG_FILE"
            STATUS=${PIPESTATUS[0]}
            set -e
            return "$STATUS"
          }

          if run_retention_test; then
            exit 0
          fi
          STATUS=$?

          if [ "$STATUS" -eq 2 ]; then
            echo "PostgreSQL harness returned exit code 2 before SQL verification; retrying once with the image already cached."
            sleep 2
            if run_retention_test; then
              exit 0
            fi
            STATUS=$?
          fi

          echo "Financial retention regression failed with exit code $STATUS. Last diagnostic lines follow."
          while IFS= read -r line; do
            line="${line//'%'/'%25'}"
            line="${line//$'\r'/'%0D'}"
            echo "::error title=Financial retention regression::${line}"
          done < <(tail -n 8 "$LOG_FILE")
          exit "$STATUS"

      - name: Lint
        run: npm run lint

      - name: Build
        run: npx next build

name: CI

on:
  push:
    branches:
      - production-app
      - main
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Typecheck
        run: npm run typecheck

      - name: Validate FA(3) against official MF XSD
        run: |
          chmod +x scripts/validate-fa3-xsd.sh
          bash scripts/run-fa3-validation.sh

      - name: Test financial retention cascade in isolated PostgreSQL 17
        run: bash scripts/test-financial-retention-postgres.sh

      - name: Lint
        run: npm run lint

      - name: Build
        run: npx next build

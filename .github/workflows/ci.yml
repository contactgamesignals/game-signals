name: CI

on:
  push:
    branches:
      - production-app
      - main
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Typecheck
        run: npm run typecheck

      - name: Validate FA(3) against official MF XSD
        run: |
          chmod +x scripts/validate-fa3-xsd.sh
          bash scripts/run-fa3-validation.sh

      - name: Setup .NET 10 for KSeF TEST E2E
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Probe GameSignal FA(3) full KSeF TEST flow
        run: bash scripts/probe-ksef-test-gamesignal-fa3-e2e.sh

      - name: Lint
        run: npm run lint

      - name: Build
        run: npx next build

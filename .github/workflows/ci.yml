name: CI

on:
  push:
    branches:
      - production-app
      - main
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Typecheck
        run: npm run typecheck

      - name: Validate FA(3) against official MF XSD
        run: |
          chmod +x scripts/validate-fa3-xsd.sh
          bash scripts/run-fa3-validation.sh

      - name: Test financial retention cascade in isolated PostgreSQL 17
        shell: bash
        run: |
          set -o pipefail
          LOG_FILE="$(mktemp)"
          set +e
          bash scripts/test-financial-retention-postgres.sh 2>&1 | tee "$LOG_FILE"
          STATUS=${PIPESTATUS[0]}
          set -e
          if [ "$STATUS" -ne 0 ]; then
            echo "Financial retention regression failed with exit code $STATUS. Last diagnostic lines follow."
            while IFS= read -r line; do
              line="${line//'%'/'%25'}"
              line="${line//$'\r'/'%0D'}"
              echo "::error title=Financial retention regression::${line}"
            done < <(tail -n 12 "$LOG_FILE")
            exit "$STATUS"
          fi

      - name: Lint
        run: npm run lint

      - name: Build
        run: npx next build
